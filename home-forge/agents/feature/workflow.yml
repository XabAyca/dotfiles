schema_version: "1.0"
workflow:
  id: "feature"
  name: "Feature autonome"
  version: "0.3.0"
  author: "xabi"
  description: "specify → plan → design → implement → review ⟲ fix → draft PR"

requires:
  speckit_version: ">=1.0.4"
  integrations:
    any:
      - "claude"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the feature"
  integration:
    type: string
    default: "auto"
  max_fix:
    type: number
    default: 3
  # Every gate carries a verdict_input: without one, a gate can only be
  # answered at a real terminal, which rules out the supervisor and Slack.
  clarify_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""
  review_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""
  ship_verdict:
    type: string
    enum: ["", push, reject]
    default: ""

steps:
  # Artefacts are written in English whatever language the description uses,
  # so branch names, commit subjects and PR titles need no translation later.
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}\n\nWrite the specification and every artefact in English."

  - id: scan-clarify
    type: shell
    run: 'bash $HOME/agents/feature/scripts/scan-clarify.sh {{ context.run_id }}'

  - id: clarify
    type: if
    condition: "{{ steps.scan-clarify.output.stdout == 'BLOCKED' }}"
    then:
      - id: clarify-gate
        type: gate
        message: "The spec has open questions. Write the answers into .specify/state/{{ context.run_id }}/human-answer.md, then approve."
        show_file: ".specify/state/{{ context.run_id }}/questions.md"
        options: [approve, reject]
        on_reject: abort
        verdict_input: clarify_verdict

      - id: apply-answers
        type: prompt
        integration: "{{ inputs.integration }}"
        timeout: 1800
        prompt: "Read .specify/state/{{ context.run_id }}/human-answer.md and resolve every [NEEDS CLARIFICATION] marker in the spec accordingly. Revise any assumption the answers invalidate, and update the checklist. Write no code."

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: design-ui
    type: prompt
    integration: "{{ inputs.integration }}"
    timeout: 1800
    prompt: "/design-ui {{ context.run_id }}"

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-loop
    type: do-while
    condition: "{{ steps.verdict.output.stdout == 'RETRY' }}"
    steps:
      - id: review
        type: prompt
        integration: "{{ inputs.integration }}"
        timeout: 1800
        prompt: "/review-feature {{ context.run_id }}"

      - id: review-ui
        type: prompt
        integration: "{{ inputs.integration }}"
        timeout: 1800
        prompt: "/review-ui {{ context.run_id }}"

      - id: verdict
        type: shell
        run: 'bash $HOME/agents/feature/scripts/verdict.sh {{ context.run_id }} {{ inputs.max_fix }}'

      - id: fix
        type: if
        condition: "{{ steps.verdict.output.stdout == 'RETRY' }}"
        then:
          - id: apply-fix
            type: prompt
            integration: "{{ inputs.integration }}"
            timeout: 1800
            prompt: "Fix only the problems listed in .specify/state/{{ context.run_id }}/review.json and, if it exists, ui.json. Do not change the spec or the plan. Re-run the tests afterwards."

  - id: escalate
    type: if
    condition: "{{ steps.verdict.output.stdout == 'ESCALATE' }}"
    then:
      - id: review-gate
        type: gate
        message: "The review loop did not converge. Read the verdict, then approve to ship anyway or reject to stop."
        show_file: ".specify/state/{{ context.run_id }}/review.json"
        options: [approve, reject]
        on_reject: abort
        verdict_input: review_verdict

      - id: apply-decision
        type: prompt
        integration: "{{ inputs.integration }}"
        timeout: 1800
        prompt: "If .specify/state/{{ context.run_id }}/human-answer.md exists, read it and apply the decision it states. If it does not, do nothing and say so."

  # review_verdict is interpolated into a shell command, which is only safe
  # because its enum confines it to three known values.
  - id: shippable
    type: shell
    run: 'bash $HOME/agents/feature/scripts/shippable.sh {{ context.run_id }} {{ inputs.review_verdict }}'

  - id: ship
    type: if
    condition: "{{ steps.shippable.output.stdout == 'SHIP' }}"
    then:
      - id: commit
        type: shell
        run: 'bash $HOME/agents/feature/scripts/commit.sh'

      - id: ship-gate
        type: gate
        message: "Push the branch and open a draft PR? Read the record below first."
        show_file: ".specify/state/{{ context.run_id }}/ship.md"
        options: [push, reject]
        # skip only skips the gate itself: the rejection must be carried over
        # to the next step, otherwise the PR would go out anyway.
        on_reject: skip
        verdict_input: ship_verdict

      - id: open-pr
        type: if
        condition: "{{ inputs.ship_verdict == 'push' }}"
        then:
          - id: do-open-pr
            type: shell
            run: 'bash $HOME/agents/feature/scripts/open-pr.sh {{ context.run_id }}'
