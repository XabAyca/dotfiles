schema_version: "1.0"
workflow:
  id: "feature"
  name: "Feature autonome"
  version: "0.4.0"
  author: "xabi"
  description: "Spec Kit drives the feature to completeness; the review loop drives it to quality"

requires:
  speckit_version: ">=1.0.4"
  integrations:
    any:
      - "claude"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the feature"
  integration:
    type: string
    default: "auto"
  max_fix:
    type: number
    default: 3
  max_converge:
    type: number
    default: 3
  # Every gate carries a verdict_input: without one, a gate can only be
  # answered at a real terminal, which rules out the supervisor and Slack.
  clarify_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""
  analyze_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""
  review_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""
  ship_verdict:
    type: string
    enum: ["", push, reject]
    default: ""

steps:
  # Artefacts are written in English whatever language the description uses,
  # so branch names, commit subjects and PR titles need no translation later.
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}\n\nWrite the specification and every artefact in English."

  # Spec Kit asks its own targeted questions and writes the answers back into
  # the spec. Only what it could not settle on its own reaches a human.
  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: scan-clarify
    type: shell
    run: 'bash $HOME/agents/feature/scripts/scan-clarify.sh {{ context.run_id }}'

  - id: still-unclear
    type: if
    condition: "{{ steps.scan-clarify.output.stdout == 'BLOCKED' }}"
    then:
      - id: clarify-gate
        type: gate
        message: "The spec still has open questions after /speckit-clarify. Write the answers into .specify/state/{{ context.run_id }}/human-answer.md, then approve."
        show_file: ".specify/state/{{ context.run_id }}/questions.md"
        options: [approve, reject]
        on_reject: abort
        verdict_input: clarify_verdict

      - id: apply-answers
        type: prompt
        integration: "{{ inputs.integration }}"
        timeout: 1800
        prompt: "Read .specify/state/{{ context.run_id }}/human-answer.md and resolve every remaining [NEEDS CLARIFICATION] marker in the spec accordingly. Revise any assumption the answers invalidate, and update the checklist. Write no code."

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: design-ui
    type: prompt
    integration: "{{ inputs.integration }}"
    timeout: 1800
    prompt: "/design-ui {{ context.run_id }}"

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # A contradiction between spec, plan and tasks is settled before code is
  # written. /speckit-analyze is read-only by design, so the step that runs it
  # records the outcome where a script can read it.
  - id: analyze
    type: prompt
    integration: "{{ inputs.integration }}"
    timeout: 1800
    prompt: "Run /speckit-analyze. Then write .specify/state/{{ context.run_id }}/analyze.json containing raw JSON with no markdown fence: {\"critical\": <count>, \"high\": <count>, \"summary\": \"one line\", \"findings\": [\"one line each\"]}. Counts come from the severity column of the report. Change nothing else."

  - id: read-analyze
    type: shell
    run: 'bash $HOME/agents/feature/scripts/read-analyze.sh {{ context.run_id }}'

  - id: contradictions
    type: if
    condition: "{{ steps.read-analyze.output.stdout == 'BLOCKING' }}"
    then:
      - id: analyze-gate
        type: gate
        message: "The analysis found a constitution breach or an uncovered requirement. Settle it before any code is written."
        show_file: ".specify/state/{{ context.run_id }}/analyze.json"
        options: [approve, reject]
        on_reject: abort
        verdict_input: analyze_verdict

      - id: apply-analysis
        type: prompt
        integration: "{{ inputs.integration }}"
        timeout: 1800
        prompt: "Read .specify/state/{{ context.run_id }}/analyze.json and, if present, human-answer.md. Correct the spec, the plan or the tasks so the critical findings no longer hold. Write no code."

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # Completeness, by Spec Kit. /speckit-converge measures the codebase against
  # the spec and appends what is missing to tasks.md; implement finishes it.
  # An untouched tasks.md is how the command says there is nothing left.
  - id: converge-loop
    type: do-while
    condition: "{{ steps.converged.output.stdout == 'MORE' }}"
    steps:
      - id: snapshot-tasks
        type: shell
        run: 'bash $HOME/agents/feature/scripts/converged.sh {{ context.run_id }} {{ inputs.max_converge }} snapshot'

      - id: converge
        command: speckit.converge
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }}"

      - id: converged
        type: shell
        run: 'bash $HOME/agents/feature/scripts/converged.sh {{ context.run_id }} {{ inputs.max_converge }} check'

      - id: finish-appended
        type: if
        condition: "{{ steps.converged.output.stdout == 'MORE' }}"
        then:
          - id: implement-appended
            command: speckit.implement
            integration: "{{ inputs.integration }}"
            input:
              args: "{{ inputs.spec }}"

  # Quality, by us. Spec Kit says whether everything was built; these say
  # whether it was built well.
  - id: review-loop
    type: do-while
    condition: "{{ steps.verdict.output.stdout == 'RETRY' }}"
    steps:
      - id: review
        type: prompt
        integration: "{{ inputs.integration }}"
        timeout: 1800
        prompt: "/review-feature {{ context.run_id }}"

      - id: review-ui
        type: prompt
        integration: "{{ inputs.integration }}"
        timeout: 1800
        prompt: "/review-ui {{ context.run_id }}"

      - id: verdict
        type: shell
        run: 'bash $HOME/agents/feature/scripts/verdict.sh {{ context.run_id }} {{ inputs.max_fix }}'

      - id: fix
        type: if
        condition: "{{ steps.verdict.output.stdout == 'RETRY' }}"
        then:
          - id: apply-fix
            type: prompt
            integration: "{{ inputs.integration }}"
            timeout: 1800
            prompt: "Fix only the problems listed in .specify/state/{{ context.run_id }}/review.json and, if it exists, ui.json. Do not change the spec or the plan. Re-run the tests afterwards."

  - id: escalate
    type: if
    condition: "{{ steps.verdict.output.stdout == 'ESCALATE' }}"
    then:
      - id: review-gate
        type: gate
        message: "The review loop did not converge. Read the verdict, then approve to ship anyway or reject to stop."
        show_file: ".specify/state/{{ context.run_id }}/review.json"
        options: [approve, reject]
        on_reject: abort
        verdict_input: review_verdict

      - id: apply-decision
        type: prompt
        integration: "{{ inputs.integration }}"
        timeout: 1800
        prompt: "If .specify/state/{{ context.run_id }}/human-answer.md exists, read it and apply the decision it states. If it does not, do nothing and say so."

  # review_verdict is interpolated into a shell command, which is only safe
  # because its enum confines it to three known values.
  - id: shippable
    type: shell
    run: 'bash $HOME/agents/feature/scripts/shippable.sh {{ context.run_id }} {{ inputs.review_verdict }}'

  - id: ship
    type: if
    condition: "{{ steps.shippable.output.stdout == 'SHIP' }}"
    then:
      - id: commit
        type: shell
        run: 'bash $HOME/agents/feature/scripts/commit.sh'

      - id: ship-gate
        type: gate
        message: "Push the branch and open a draft PR? Read the record below first."
        show_file: ".specify/state/{{ context.run_id }}/ship.md"
        options: [push, reject]
        # skip only skips the gate itself: the rejection must be carried over
        # to the next step, otherwise the PR would go out anyway.
        on_reject: skip
        verdict_input: ship_verdict

      - id: open-pr
        type: if
        condition: "{{ inputs.ship_verdict == 'push' }}"
        then:
          - id: do-open-pr
            type: shell
            run: 'bash $HOME/agents/feature/scripts/open-pr.sh {{ context.run_id }}'
