schema_version: "1.0"
workflow:
  id: "feature"
  name: "Feature autonome"
  version: "0.23.0"
  author: "xabi"
  description: "Spec Kit drives the feature to completeness; the review loop drives it to quality"

requires:
  speckit_version: ">=1.0.4"
  integrations:
    any:
      - "claude"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the feature"
  integration:
    type: string
    default: "auto"
  # One fix and the review that checks it. Past that the reviewer only finds
  # new trivia, and a person overrules it anyway.
  max_fix:
    type: number
    default: 2
  # One lap to build what converge found and one to check it is gone. A
  # third only ever reached the gate a person approved.
  max_converge:
    type: number
    default: 2
  # Every gate carries a verdict_input: without one, a gate can only be
  # answered at a real terminal, which rules out `agent menu`.
  decision_verdict:
    type: string
    enum: ["", approve, reject]
    default: ""
  ship_verdict:
    type: string
    enum: ["", push, reject]
    default: ""

steps:
  # The spec follows the language of the constitution, since that is what the
  # analysis and the review measure it against. Everything a machine names —
  # feature, worktree, branch, commit subject, PR title — stays English.
  # Headless, nobody approves a preliminary note a project convention asks
  # for: the decision gate shows the assumptions instead.
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}\n\nWrite the specification in the language of .specify/memory/constitution.md, English if there is none. The feature name, the worktree, the branch, the commit subjects and the PR title stay in English. Nobody will answer or approve anything: skip any preliminary note, summary or validation step a project convention asks for and write the spec now. Mark every choice you make alone [ASSUMPTION: <the choice>]."

  # An agent that stops to ask still exits 0, and every step after it would
  # then run on a feature that does not exist.
  - id: specified
    type: shell
    run: 'bash $HOME/agents/feature/scripts/produced.sh spec'

  # Headless, /speckit.clarify has nobody to ask. What it settles alone is
  # marked, so the decision gate can show it and a person can overrule it.
  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    model: "sonnet"
    input:
      args: "{{ inputs.spec }}\n\nNobody will answer your questions. For each one, take the answer you would recommend, write it into the spec and mark it [ASSUMPTION: <the choice>]. Leave no [NEEDS CLARIFICATION] marker behind."

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: planned
    type: shell
    run: 'bash $HOME/agents/feature/scripts/produced.sh plan'

  - id: design-ui
    type: prompt
    integration: "{{ inputs.integration }}"
    timeout: 1800
    prompt: "/design-ui {{ context.run_id }}"

  # The marker is what decision.sh looks for: a task no agent can do must
  # reach a person before the code that depends on it.
  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}\n\nMark [HUMAN], right after the task id, every task only a person can do: a check outside this repository, a decision nobody has recorded yet. Each acceptance scenario of the spec gets a test task that walks it through the entry point a user or a caller uses — the route, the form, the job."

  - id: tasked
    type: shell
    run: 'bash $HOME/agents/feature/scripts/produced.sh tasks'

  # /speckit-analyze is read-only by design, so the step that runs it records
  # the outcome where a script can read it. A record the script cannot read
  # goes back to the step once, with the reason, before it stops the run.
  - id: analyze-loop
    type: do-while
    max_iterations: 2
    condition: "{{ steps.decision.output.stdout == 'REPAIR' }}"
    steps:
      - id: analyze
        type: prompt
        integration: "{{ inputs.integration }}"
        model: "sonnet"
        timeout: 1800
        prompt: "Run /speckit-analyze. Then write .specify/state/{{ context.run_id }}/analyze.json containing raw JSON with no markdown fence: {\"critical\": <count>, \"high\": <count>, \"summary\": \"one line\", \"findings\": [\"one line each\"]}. Counts come from the severity column of the report. If .specify/state/{{ context.run_id }}/repair.md exists, your last analyze.json was rejected for the reason it gives. Change nothing else."

      - id: decision
        type: shell
        run: 'bash $HOME/agents/feature/scripts/check.sh {{ context.run_id }} decision bash $HOME/agents/feature/scripts/decision.sh {{ context.run_id }}'

  # The one stop before code, the last place a wrong direction is cheap. A
  # gate speaks to a human, so it speaks French — and in one shape: the first
  # line is the title the channel puts in its header, the rest is the body,
  # the options it offers included.
  # Nothing to decide is no reason to keep a person waiting.
  - id: needs-decision
    type: if
    condition: "{{ steps.decision.output.stdout == 'REVIEW' }}"
    then:
      - id: decision-gate
        type: gate
        message: "Avant le code\n\nRien n'a encore été codé. Ci-dessous : les hypothèses prises sur la spec, les constats de l'analyse, les tâches que seul un humain peut faire, puis le plan.\n\n*Répondre avec `agent menu` :*\n• `approve` — je construis ça ; je tranche moi-même chaque constat ouvert et je note chaque choix dans le plan\n• `reject` — le run s'arrête ici\n• _du texte libre_ — tes décisions, tes corrections du plan et tes réponses aux tâches humaines, que j'applique telles quelles avant de construire"
        show_file: ".specify/state/{{ context.run_id }}/decision.md"
        # Not an engine key: it ignores this one and keeps it in the copy it
        # freezes, which is where the gateway reads it.
        answer_file: decision-answer.md
        options: [approve, reject]
        on_reject: abort
        verdict_input: decision_verdict

  # A choice recorded in plan.md is one the review treats as made, instead of
  # asking for it a second time.
  - id: apply-decision
    type: prompt
    integration: "{{ inputs.integration }}"
    timeout: 1800
    prompt: "Read .specify/state/{{ context.run_id }}/analyze.json and, if it exists, .specify/state/{{ context.run_id }}/decision-answer.md. What the answer states settles what it covers: an assumption it overrules, a correction to the plan, a finding it decides, a [HUMAN] task it answers (record the answer in that task and check it). Settle every other critical or high finding, and any [NEEDS CLARIFICATION] left, with the most defensible reading of the spec and the constitution. Correct the spec, the plan or the tasks accordingly. Then add to plan.md a '## Decisions' section listing every choice made at this point, each marked (human) when the answer made it and (agent, delegated) otherwise. Leave a [HUMAN] task nobody answered open. Write no code."

  # Nobody reads what a headless agent says when it stops, so why it stopped
  # goes in a file the ship gate shows.
  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}\n\nIf you stop with tasks still unchecked, write .specify/state/{{ context.run_id }}/blocked.md: for each one, what blocks it and the question a person must answer. A comment says why, never what: one per non-obvious reason, never a paraphrase of the code nor the story of a fix."

  # Completeness, by Spec Kit. /speckit-converge measures the codebase against
  # the spec and appends what is missing to tasks.md; implement finishes it.
  # An untouched tasks.md is how the command says there is nothing left, but
  # only once implement has checked every task it had.
  - id: converge-loop
    type: do-while
    condition: "{{ steps.converged.output.stdout == 'MORE' }}"
    steps:
      - id: snapshot-tasks
        type: shell
        run: 'bash $HOME/agents/feature/scripts/converged.sh {{ context.run_id }} {{ inputs.max_converge }} snapshot'

      - id: converge
        command: speckit.converge
        integration: "{{ inputs.integration }}"
        input:
          args: "{{ inputs.spec }}"

      - id: converged
        type: shell
        run: 'bash $HOME/agents/feature/scripts/converged.sh {{ context.run_id }} {{ inputs.max_converge }} check'

      - id: finish-appended
        type: if
        condition: "{{ steps.converged.output.stdout == 'MORE' }}"
        then:
          - id: implement-appended
            command: speckit.implement
            integration: "{{ inputs.integration }}"
            input:
              args: "{{ inputs.spec }}\n\nIf you stop with tasks still unchecked, write .specify/state/{{ context.run_id }}/blocked.md: for each one, what blocks it and the question a person must answer. A comment says why, never what: one per non-obvious reason, never a paraphrase of the code nor the story of a fix."

  # What implement gave up on goes back to it once, with its own reasons; a
  # task only a person can do is marked so and left for the ship gate. Only a
  # second give-up stops the run.
  - id: implement-blocked
    type: if
    condition: "{{ steps.converged.output.stdout == 'BLOCKED' }}"
    then:
      - id: repair-implement
        type: do-while
        max_iterations: 2
        condition: "{{ steps.implemented.output.stdout == 'REPAIR' }}"
        steps:
          - id: implement-open
            command: speckit.implement
            integration: "{{ inputs.integration }}"
            input:
              args: "{{ inputs.spec }}\n\nRead .specify/state/{{ context.run_id }}/incomplete.md and, if it exists, repair.md: the tasks a previous pass left unchecked and why. Finish every one that needs no person. One that truly does — a decision nobody has recorded, a check outside this repository — gets [HUMAN] right after its id and the question it waits on, and stays unchecked. A comment says why, never what: one per non-obvious reason, never a paraphrase of the code nor the story of a fix."

          - id: implemented
            type: shell
            run: 'bash $HOME/agents/feature/scripts/check.sh {{ context.run_id }} implemented bash $HOME/agents/feature/scripts/implemented.sh'

  # Quality, by us. Spec Kit says whether everything was built; these say
  # whether it was built well. What they leave standing goes to the ship gate,
  # not to a gate of its own: that is where a person reads how the run went.
  # REPAIR is a review that wrote no verdict: it runs again, and costs no fix.
  - id: review-loop
    type: do-while
    condition: "{{ steps.verdict.output.stdout == 'RETRY' or steps.verdict.output.stdout == 'REPAIR' }}"
    steps:
      # Side by side: only review-feature runs the tests, and each writes its
      # own verdict file.
      - id: reviews
        type: fan-out
        items: ["review-feature", "review-ui"]
        max_concurrency: 2
        step:
          id: review
          type: prompt
          integration: "{{ inputs.integration }}"
          timeout: 1800
          prompt: "/{{ item }} {{ context.run_id }}"

      - id: verdict
        type: shell
        run: 'bash $HOME/agents/feature/scripts/check.sh {{ context.run_id }} verdict bash $HOME/agents/feature/scripts/verdict.sh {{ context.run_id }} {{ inputs.max_fix }}'

      - id: fix
        type: if
        condition: "{{ steps.verdict.output.stdout == 'RETRY' }}"
        then:
          - id: apply-fix
            type: prompt
            integration: "{{ inputs.integration }}"
            timeout: 1800
            prompt: "Fix only the blocking problems listed in .specify/state/{{ context.run_id }}/review.json and, if it exists, ui.json; leave the bullets prefixed Note: alone. A comment says why, never what: one per non-obvious reason, never a paraphrase of the code nor the story of a fix. Do not change the spec or the plan. Re-run the tests afterwards."

  - id: ship-summary
    type: shell
    run: 'bash $HOME/agents/feature/scripts/ship-summary.sh {{ context.run_id }}'

  - id: list-changes
    type: shell
    run: 'bash $HOME/agents/feature/scripts/commit.sh {{ context.run_id }} list'

  # The agent only decides the split; the script commits it and refuses a
  # split that leaves a change out, so Claude never runs git here.
  - id: split
    type: if
    condition: "{{ steps.list-changes.output.stdout == 'CHANGES' }}"
    then:
      - id: split-commits
        type: prompt
        integration: "{{ inputs.integration }}"
        model: "sonnet"
        timeout: 1800
        prompt: "Read .specify/state/{{ context.run_id }}/changes.txt and changes.diff. Split these changes into commits of one topic each, in the order they apply: documentation apart, migrations apart, the Spec Kit documents apart, then the feature — in several commits when it is big, one per slice that stands on its own. Each commit carries the tests of the code it holds. Write .specify/state/{{ context.run_id }}/commits.json as [{\"subject\": \"<gitmoji> <one-line English subject>\", \"paths\": [\"...\"]}], every path of changes.txt in exactly one commit. Run no git command."

      - id: commit
        type: shell
        run: 'bash $HOME/agents/feature/scripts/commit.sh {{ context.run_id }} apply'

  # A run whose reviews passed and that left nothing open goes out as a draft
  # without asking: the draft PR is where a person reads it anyway.
  - id: needs-ship-gate
    type: if
    condition: "{{ steps.ship-summary.output.stdout != 'Prêt à livrer' }}"
    then:
      - id: ship-gate
        type: gate
        message: "{{ steps.ship-summary.output.stdout }}\n\nTout est commité sur la branche ; le récapitulatif est ci-dessous.\n\n*Répondre avec `agent menu` :*\n• `push` — je pousse et j'ouvre une PR en draft\n• `reject` — ça reste sur la machine\n\n_Seuls ces deux mots sont lus ici ; une réponse rédigée est refusée._"
        show_file: ".specify/state/{{ context.run_id }}/ship.md"
        options: [push, reject]
        # skip only skips the gate itself: the rejection must be carried over
        # to the next step, otherwise the PR would go out anyway.
        on_reject: skip
        verdict_input: ship_verdict

  - id: open-pr
    type: if
    condition: "{{ inputs.ship_verdict == 'push' or steps.ship-summary.output.stdout == 'Prêt à livrer' }}"
    then:
      # Only an agent can fill the repository's own template. Without one,
      # open-pr.sh lists the commits and no model is called.
      - id: pr-template
        type: shell
        run: 'bash $HOME/agents/feature/scripts/pr-template.sh'

      - id: fill-template
        type: if
        condition: "{{ steps.pr-template.output.stdout != '' }}"
        then:
          - id: pr-body
            type: prompt
            integration: "{{ inputs.integration }}"
            model: "sonnet"
            timeout: 900
            prompt: "Fill in the pull request template {{ steps.pr-template.output.stdout }} for this branch and write the result to .specify/state/{{ context.run_id }}/pr-body.md. Keep its headings and their order. Answer each section from the spec, the plan, the commits on this branch and .specify/state/{{ context.run_id }}/review.json. Tick a checklist item only when this run did it. Leave a section you cannot answer, a ticket link for one, as the template has it. Write in the language of the template. Change no other file and run no git command that changes anything."

      - id: do-open-pr
        type: shell
        # A shell step defaults to 300s, and a push can outlast it after
        # having succeeded.
        timeout: 900
        run: 'bash $HOME/agents/feature/scripts/open-pr.sh {{ context.run_id }}'
